spring.application.name=him-path
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/him_path?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=always
server.port=8080
# eSewa ePay v2 UAT defaults; override with merchant credentials for production.
himpath.esewa.product-code=${ESEWA_PRODUCT_CODE:EPAYTEST}
himpath.esewa.secret=${ESEWA_SECRET:8gBm/:&EnhH.1/q}
himpath.esewa.checkout-url=${ESEWA_CHECKOUT_URL:https://rc-epay.esewa.com.np/api/epay/main/v2/form}
himpath.esewa.status-url=${ESEWA_STATUS_URL:https://uat.esewa.com.np/api/epay/transaction/status/}
himpath.public-base-url=${HIMPATH_PUBLIC_BASE_URL:http://localhost:8080}


# Optional SMTP settings for customer booking and rental confirmations.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
himpath.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
himpath.gemini.api-key=${GEMINI_API_KEY:}
himpath.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
